<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Model</title>

    <style>
        .container {
            background-color: rgb(0, 208, 255);
            display: flex; 
            gap: 30px;
            flex-wrap: wrap;
            height: 600px;
            border: 5px solid tomato;
            justify-content: center;
            align-items: center;
          

        }
        .box{
           background-color: burlywood;
           height:100px;
           width: 100px;
           font-size: 2em;
           gap: 30px;
           text-align: center;
          
        }
    </style>
     
    
</head>


<body>
    <header>
        <h1>Flex Box Model</h1>
    </header>
    <main>
            <div class="container">
                <div class="box">box</div>
            </div>
    </main>
</body>
</html>
